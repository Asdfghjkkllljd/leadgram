name: Build TgSendDelay Dylib
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          sudo mkdir -p /opt/theos
          sudo chown $USER /opt/theos
          git clone --recursive https://github.com/theos/theos.git /opt/theos
          echo "THEOS=/opt/theos" >> $GITHUB_ENV
          brew install ldid

      - name: Build Dylib
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p td && cd td
          cp ${{ github.workspace }}/Tweak.x .
          cat > Makefile <<'EOF'
          TARGET := iphone:clang:latest:15.0
          ARCHS = arm64
          include $(THEOS)/makefiles/common.mk
          LIBRARY_NAME = TgSendDelay
          TgSendDelay_FILES = Tweak.x
          TgSendDelay_CFLAGS = -fobjc-arc
          TgSendDelay_INSTALL_PATH = /usr/lib
          TgSendDelay_FRAMEWORKS = UIKit Foundation
          include $(THEOS_MAKE_PATH)/library.mk
          EOF
          make FINALPACKAGE=1
          find .theos -name "TgSendDelay.dylib" -exec cp {} ${{ github.workspace }}/TgSendDelay.dylib \;

      - uses: actions/upload-artifact@v4
        with:
          name: TgSendDelay
          path: ${{ github.workspace }}/TgSendDelay.dylib
